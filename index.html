<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080c">
<title>Auction Block</title>
<style>
:root{
  --bg:#06080c; --bg2:#0b0f16; --panel:#10151f; --panel2:#161d2a; --line:#232d3f; --line2:#2e3a50;
  --text:#eef2f8; --muted:#8b97ab; --dim:#5a667c;
  --p1:#2f9bff; --p1-deep:#0a2f55; --p2:#ff5a2e; --p2-deep:#5a1a08;
  --gold:#f7c948; --rev:#39e27d; --dump:#b57bff; --danger:#ff3b5c;
  --act:transparent;
  --cond:"Bahnschrift Condensed","Bahnschrift SemiBold Condensed","Bahnschrift","Avenir Next Condensed","HelveticaNeue-CondensedBold","Roboto Condensed","Arial Narrow",sans-serif-condensed,Impact,sans-serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:
  radial-gradient(1200px 500px at 50% -120px,#15213a 0%,transparent 70%),
  repeating-linear-gradient(115deg,rgba(255,255,255,.018) 0 2px,transparent 2px 9px),
  var(--bg);color:var(--text);font:15px/1.4 var(--sans);-webkit-tap-highlight-color:transparent}
body[data-actor="0"]{--act:var(--p1);--act-deep:var(--p1-deep)}
body[data-actor="1"]{--act:var(--p2);--act-deep:var(--p2-deep)}
body[data-actor]::before{content:"";position:fixed;inset:0;border:5px solid var(--act);pointer-events:none;z-index:50;box-shadow:inset 0 0 40px -10px var(--act)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed}
.cond{font-family:var(--cond);font-stretch:condensed;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.lbl{font:600 11px/1.2 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.c-p1{color:var(--p1)} .c-p2{color:var(--p2)} .c-gold{color:var(--gold)} .c-rev{color:var(--rev)} .c-muted{color:var(--muted)}
.app{max-width:1180px;margin:0 auto;padding:12px 16px 0;min-height:100vh;display:flex;flex-direction:column}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:10px 18px;border-radius:10px;border:2px solid var(--line2);background:var(--panel2);font-family:var(--cond);font-stretch:condensed;font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;line-height:1.05;text-align:center;transition:transform .08s,filter .15s,opacity .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.32;filter:grayscale(.8)}
.btn small{display:block;font:600 11px/1.2 var(--sans);letter-spacing:.12em;opacity:.85;text-transform:uppercase}
.btn-col{flex-direction:column;gap:2px}
.btn-act{background:var(--act);border-color:var(--act);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.btn-ghost{background:transparent;border-color:rgba(255,255,255,.28)}
.btn-dump{background:var(--dump);border-color:var(--dump);color:#170826}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#1d1604}
.btn-white{background:#f2f5fa;border-color:#f2f5fa;color:#0a0e15}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-sq{min-width:56px;padding:0;font-size:28px}
.btn-wide{width:100%}

/* ---------- start screen ---------- */
.start{max-width:760px;margin:0 auto;width:100%;padding-bottom:40px}
.hero{position:relative;margin:18px 0 22px;padding:22px 20px 18px;background:linear-gradient(100deg,#0f1a2e,#10151f 55%,#1a0f0c);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:0;bottom:0;width:180px;background:repeating-linear-gradient(115deg,rgba(247,201,72,.14) 0 10px,transparent 10px 22px);transform:skewX(-15deg)}
.hero h1{margin:4px 0 6px;font-family:var(--cond);font-stretch:condensed;font-weight:800;font-size:clamp(46px,11vw,84px);line-height:.88;text-transform:uppercase;letter-spacing:-.005em}
.hero h1 span{color:var(--gold)}
.hero p{margin:0;color:var(--muted);max-width:520px;position:relative;z-index:1}
.rules{display:grid;gap:8px;margin:0 0 22px;padding:0;list-style:none;counter-reset:r}
.rules li{position:relative;padding:10px 12px 10px 48px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:14px;color:#cfd7e4}
.rules li::before{counter-increment:r;content:counter(r);position:absolute;left:12px;top:9px;width:26px;height:26px;border-radius:6px;background:var(--panel2);display:grid;place-items:center;font:700 14px var(--cond);color:var(--gold)}
.rules b{color:var(--text)}
.settings{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 16px;margin-bottom:18px}
.set{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .lbl{color:var(--text)}
.set .hint{font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:0;text-transform:none;font-weight:400}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.seg button{min-height:44px;min-width:64px;padding:6px 12px;border:0;border-radius:8px;background:transparent;font:700 16px var(--cond);font-stretch:condensed;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:#1d1604}
.step{display:inline-flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);font:700 22px var(--cond)}
.step output{min-width:58px;text-align:center;font:800 26px var(--cond);font-stretch:condensed}
.load{margin:18vh auto;text-align:center;color:var(--muted)}
.err{max-width:640px;margin:10vh auto;background:var(--panel);border:1px solid var(--danger);border-radius:14px;padding:22px}
.err h2{margin:0 0 8px;font:800 30px var(--cond);font-stretch:condensed;text-transform:uppercase;color:var(--danger)}
.err pre{background:#000;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;color:var(--gold);font-size:14px}

/* ---------- lot screen layout ---------- */
.lotgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"p1 p2" "stage stage";gap:10px;flex:1}
.pp-0{grid-area:p1} .pp-1{grid-area:p2} .stage{grid-area:stage}
@media (min-width:960px){
  .lotgrid{grid-template-columns:270px 1fr 270px;grid-template-areas:"p1 stage p2";align-items:start;gap:16px}
  .pp{position:sticky;top:12px}
}

/* ---------- player panels ---------- */
.pp{--pc:var(--p1);--pd:var(--p1-deep);background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:12px;padding:10px;min-width:0;transition:opacity .2s,box-shadow .2s}
.pp-1{--pc:var(--p2);--pd:var(--p2-deep)}
.pp.is-act{box-shadow:0 0 0 2px var(--pc),0 8px 30px -8px var(--pc);background:linear-gradient(180deg,var(--pd),var(--panel) 60%)}
.pp.is-idle{opacity:.62}
.pp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.pp-name{font:800 18px/1 var(--cond);font-stretch:condensed;text-transform:uppercase;color:var(--pc);letter-spacing:.03em}
.pp-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;min-height:16px}
.tag{display:inline-block;padding:2px 6px;border-radius:4px;font:700 10px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;background:var(--panel2);color:var(--muted)}
.tag-open{background:var(--pc);color:#fff}
.pp-budget{font:800 34px/.9 var(--cond);font-stretch:condensed;color:var(--text)}
.pp-left{display:flex;align-items:center;gap:6px;margin:9px 0 6px}
.pips{display:flex;gap:3px}
.pips i{width:9px;height:9px;border-radius:2px;background:var(--pc);display:block}
.pips i.full{background:var(--line2)}
.slots{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.slots li{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:6px;min-height:28px;padding:3px 6px;background:var(--bg2);border-radius:6px;font-size:13px}
.slots li b{font:800 13px var(--cond);font-stretch:condensed;letter-spacing:.06em;color:var(--muted)}
.slots li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slots li em{font:700 14px var(--cond);font-style:normal;color:var(--gold)}
.slots li em.dump{color:var(--dump)}
.slots li.empty span{color:var(--dim)}
.slots li.filled b{color:var(--pc)}
.slots li .fx{font:600 10px var(--sans);color:var(--muted);letter-spacing:.08em;margin-left:4px}
.wc{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.wc button{min-height:44px;border-radius:8px;border:2px solid var(--pc);background:transparent;font:800 15px var(--cond);font-stretch:condensed;letter-spacing:.1em;text-transform:uppercase;color:var(--pc);padding:4px}
.wc button small{display:block;font:600 9px var(--sans);letter-spacing:.1em;color:var(--muted)}
.wc button.spent{border-style:dashed;border-color:var(--line2);color:var(--dim);text-decoration:line-through}
.wc button.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.wc button:disabled:not(.spent){opacity:.45}
.wc .cancel{grid-column:1 / -1;min-height:36px;border-color:var(--line2);color:var(--muted);font-size:13px}

/* ---------- stage ---------- */
.stage{min-width:0;display:flex;flex-direction:column;gap:10px;--ph:var(--gold)}
.stage.ph-dump{--ph:var(--dump)}
.lothead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lotno{font:800 22px/1 var(--cond);font-stretch:condensed;text-transform:uppercase;background:#f2f5fa;color:#0a0e15;padding:6px 12px 5px;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%);letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:5px;background:var(--panel2);border:1px solid var(--line2);font:700 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.chip.p1{border-color:var(--p1);color:var(--p1)} .chip.p2{border-color:var(--p2);color:var(--p2)}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.lotprog{margin-left:auto}
.banner{position:relative;overflow:hidden;border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px}
.banner h3{margin:0;font:800 26px/1 var(--cond);font-stretch:condensed;text-transform:uppercase;letter-spacing:.02em}
.banner p{margin:2px 0 0;font-size:13px}
.banner-dump{background:repeating-linear-gradient(135deg,var(--dump) 0 16px,#12081d 16px 32px);padding:4px}
.banner-dump .in{background:#12081d;border-radius:7px;padding:10px 14px;width:100%}
.banner-dump h3{color:var(--dump);font-size:34px;letter-spacing:.04em}
.banner-dump p{color:#e2d0ff}
.banner-solo{background:linear-gradient(90deg,var(--sd,#222),var(--panel) 85%);border:1px solid var(--sc,var(--line2))}
.banner-solo h3{color:#fff}
.banner-solo p{color:#dbe2ee}
.lock{flex:none;position:relative;width:26px;height:22px;border-radius:4px;background:var(--sc,#fff);margin-top:10px}
.lock::before{content:"";position:absolute;left:4px;right:4px;top:-11px;height:14px;border:4px solid var(--sc,#fff);border-bottom:0;border-radius:10px 10px 0 0}
.lock::after{content:"";position:absolute;left:50%;top:7px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:#0a0e15}
.notice{border:1px dashed var(--gold);color:var(--gold);border-radius:8px;padding:8px 12px;font-size:13px}
.flash{border-left:4px solid var(--danger);background:rgba(255,59,92,.1);border-radius:6px;padding:8px 12px;font-size:13px}

/* ---------- trading card ---------- */
.cardwrap{display:flex;justify-content:center;perspective:900px}
.card{--tc:#334;--tc2:#889;position:relative;width:min(310px,100%);border-radius:16px;padding:5px;background:linear-gradient(150deg,var(--tc2) 0%,var(--tc) 35%,#0b0f16 70%,var(--tc2) 100%);box-shadow:0 20px 50px -18px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.06);animation:deal .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes deal{from{transform:translateY(24px) rotateX(18deg) scale(.94);opacity:0}}
.card-in{position:relative;border-radius:12px;overflow:hidden;background:#0b1018}
.card-photo{position:relative;height:178px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;background:radial-gradient(260px 160px at 50% 115%,var(--tc) 0%,transparent 75%),repeating-linear-gradient(135deg,rgba(255,255,255,.045) 0 5px,transparent 5px 12px),linear-gradient(180deg,#0f1622,#0b1018)}
.card-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.10) 45%,transparent 60%);pointer-events:none}
.card-pos{position:absolute;left:10px;top:10px;font:800 22px/1 var(--cond);font-stretch:condensed;background:var(--ph,var(--gold));color:#0a0e15;padding:5px 9px 4px;border-radius:4px;letter-spacing:.05em}
.card-team{position:absolute;right:10px;top:10px;font:800 16px/1 var(--cond);font-stretch:condensed;padding:5px 8px 4px;border-radius:4px;background:var(--tc);color:#fff;border:1px solid var(--tc2);letter-spacing:.06em}
.card-nm{padding:10px 14px 8px;border-top:3px solid var(--tc2)}
.card-first{font:600 12px/1.2 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.card-last{font:800 34px/.92 var(--cond);font-stretch:condensed;text-transform:uppercase;letter-spacing:.005em;overflow-wrap:anywhere}
.card-meta{display:flex;border-top:1px solid var(--line)}
.card-meta div{flex:1;padding:7px 10px;border-right:1px solid var(--line)}
.card-meta div:last-child{border-right:0}
.card-meta b{display:block;font:800 20px/1 var(--cond);font-stretch:condensed}
.card-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.card-stats div{padding:7px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.card-stats div:nth-child(3n){border-right:0}
.card-stats b{display:block;font:800 19px/1 var(--cond);font-stretch:condensed}
.card-stats .lbl{font-size:9px;letter-spacing:.1em}
.card-hidden{padding:8px 12px;border-top:1px solid var(--line);font:600 10px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--dim);text-align:center}
.av{position:relative;flex:none;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--tc,#334);color:#fff;font-family:var(--cond);font-stretch:condensed;font-weight:800;letter-spacing:.02em;box-shadow:0 0 0 3px var(--tc2,#556)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%;background:#0e141e}
.av.def{border-radius:50%;box-shadow:0 0 0 4px var(--tc2),0 0 0 7px var(--tc)}

/* ---------- price box ---------- */
.price{display:flex;align-items:stretch;border-radius:10px;overflow:hidden;border:1px solid var(--line2);background:var(--panel)}
.price > div{padding:8px 14px;display:flex;flex-direction:column;justify-content:center}
.price .big{font:800 50px/.9 var(--cond);font-stretch:condensed;color:var(--ph);min-width:110px}
.price .who{flex:1;border-left:1px solid var(--line2)}
.price .who b{font:800 20px/1.05 var(--cond);font-stretch:condensed;text-transform:uppercase}
.dpips{display:flex;gap:5px;margin-top:6px}
.dpips i{width:22px;height:7px;border-radius:2px;background:var(--line2)}
.dpips i.on{background:var(--danger)}

/* ---------- ticker / history ---------- */
.ticker{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.ticker li{font-size:13px;color:var(--muted);padding:3px 8px;border-left:3px solid var(--line2)}
.ticker li:first-child{color:var(--text)}
.ticker li.p1{border-left-color:var(--p1)} .ticker li.p2{border-left-color:var(--p2)} .ticker li.sys{border-left-color:var(--gold)}
.hist{border-top:1px solid var(--line);padding-top:8px}
.hist ol{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px}
.hist li{display:grid;grid-template-columns:30px 34px 1fr auto;gap:6px;font-size:12px;color:var(--muted);align-items:center}
.hist li b{font:700 12px var(--cond)}

/* ---------- dock (active player's controls) ---------- */
.dock{position:sticky;bottom:0;z-index:20;margin:4px -16px 0;padding:0 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(6,8,12,0),var(--bg) 22px)}
.dock-in{border-radius:14px 14px 10px 10px;overflow:hidden;border:2px solid var(--act,var(--line2));background:var(--panel);box-shadow:0 -10px 40px -12px var(--act,transparent)}
.dock-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--act);color:#fff;position:relative;overflow:hidden}
.dock-head::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.13) 0 14px,transparent 14px 30px);animation:slide 1.4s linear infinite;pointer-events:none}
@keyframes slide{to{background-position:66px 0}}
.dock-head h2{margin:0;font:800 30px/1 var(--cond);font-stretch:condensed;text-transform:uppercase;letter-spacing:.03em;position:relative;z-index:1;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.dock-head .lbl{color:rgba(255,255,255,.88);position:relative;z-index:1;text-align:right}
.dock-head.neutral{background:var(--panel2);color:var(--text)}
.dock-head.neutral::after{display:none}
.dock-body{padding:12px;display:grid;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bidrow{display:grid;grid-template-columns:56px 1fr 56px;gap:8px}
.cap{font-size:12px;color:var(--muted);text-align:center}
.cap b{color:var(--text)}

/* ---------- result + coin ---------- */
.result{text-align:center;padding:4px 0 2px}
.stamp{display:inline-block;font:800 40px/1 var(--cond);font-stretch:condensed;text-transform:uppercase;letter-spacing:.06em;padding:6px 16px 4px;border:4px solid currentColor;border-radius:8px;transform:rotate(-4deg);animation:stamp .35s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:rotate(-4deg) scale(2.2);opacity:0}}
.result p{margin:10px 0 0;color:#cfd7e4}
.result .money{font:800 22px var(--cond);font-stretch:condensed}
.coin{width:110px;height:110px;margin:6px auto 10px;position:relative;transform-style:preserve-3d;animation:flip 1.6s cubic-bezier(.25,.8,.35,1) both}
.coin div{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font:800 30px var(--cond);backface-visibility:hidden;border:6px solid rgba(0,0,0,.25)}
.coin .f0{background:var(--p1);color:#fff}
.coin .f1{background:var(--p2);color:#fff;transform:rotateY(180deg)}
.coin.w0{--end:1800deg} .coin.w1{--end:1980deg}
@keyframes flip{from{transform:rotateY(0)}to{transform:rotateY(var(--end))}}
.after-flip{animation:fadein .3s 1.6s both}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(3,5,8,.82);display:grid;place-items:center;padding:16px;animation:fadein .15s both}
.modal-in{width:min(460px,100%);background:var(--panel);border:2px solid var(--act,var(--line2));border-radius:14px;overflow:hidden}
.modal-in .dock-body p{margin:0;color:#cfd7e4}

/* ---------- reveal ---------- */
.reveal{max-width:980px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px;padding-bottom:28px}
.bug{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;margin:0 -16px;padding:8px 16px;background:linear-gradient(180deg,var(--bg) 70%,rgba(6,8,12,0))}
.bug .side{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;min-height:58px}
.bug .s0{background:linear-gradient(90deg,var(--p1-deep),var(--p1));clip-path:polygon(0 0,100% 0,100% 100%,0 100%);border-radius:10px 0 0 10px}
.bug .s1{background:linear-gradient(270deg,var(--p2-deep),var(--p2));flex-direction:row-reverse;border-radius:0 10px 10px 0}
.bug .nm{font:800 18px/1 var(--cond);font-stretch:condensed;text-transform:uppercase;letter-spacing:.04em}
.bug .sc{font:800 44px/.9 var(--cond);font-stretch:condensed;min-width:52px;text-align:center}
.bug .mid{background:#f2f5fa;color:#0a0e15;display:grid;place-items:center;padding:0 14px;min-width:78px;text-align:center}
.bug .mid b{font:800 22px/1 var(--cond);font-stretch:condensed}
.bug .mid span{font:700 9px var(--sans);letter-spacing:.16em}
.bug .sc.bump{animation:bump .5s}
.bug .short{display:none}
@media (max-width:560px){.bug .full{display:none}.bug .short{display:inline}}
@keyframes bump{40%{transform:scale(1.35);color:var(--gold)}}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{--pc:var(--p1);background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:12px;padding:10px;min-width:0}
.team.t1{--pc:var(--p2)}
.team h3{margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;font:800 22px/1 var(--cond);font-stretch:condensed;text-transform:uppercase;color:var(--pc)}
.team h3 span{font-size:14px;color:var(--muted);letter-spacing:.06em}
.mini{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.mini .nm{font:800 17px/1.05 var(--cond);font-stretch:condensed;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .sub{font-size:11px;color:var(--muted);letter-spacing:.06em}
.mini .pd{font:800 17px var(--cond);color:var(--gold);text-align:right}
.mini .pd small{display:block;font:600 9px var(--sans);letter-spacing:.1em;color:var(--muted)}
.swapbox{background:var(--panel);border:2px solid var(--act);border-radius:14px;overflow:hidden}
.swaprow{display:grid;grid-template-columns:52px 1fr 26px 1fr;align-items:center;gap:8px;width:100%;min-height:62px;padding:8px 12px;background:transparent;border:0;border-top:1px solid var(--line);text-align:left}
.swaprow:disabled{opacity:.4}
.swaprow b.slot{font:800 20px var(--cond);color:var(--act)}
.swaprow .nm{font:800 16px/1.05 var(--cond);font-stretch:condensed;text-transform:uppercase}
.swaprow .sub{font-size:11px;color:var(--muted)}
.swaprow .arrow{font:800 20px var(--cond);color:var(--muted);text-align:center}
.swaprow .locked{grid-column:2 / -1;font:700 12px var(--sans);letter-spacing:.2em;color:var(--danger)}
.qblock{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qhead{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--panel2);font:800 18px var(--cond);font-stretch:condensed;text-transform:uppercase;letter-spacing:.06em}
.drv{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.drv.enter{animation:drv .45s cubic-bezier(.2,.9,.3,1) both}
@keyframes drv{from{opacity:0;transform:translateX(-14px);background:rgba(247,201,72,.12)}}
.drv .t{font:800 15px var(--cond);text-align:center;border-radius:4px;padding:3px 0 2px;color:#fff}
.drv .t.s0{background:var(--p1)} .drv .t.s1{background:var(--p2)}
.drv .tx{font-size:14px;min-width:0}
.drv .tx b{font-family:var(--cond);font-stretch:condensed;font-size:17px;letter-spacing:.03em}
.drv .tx .td{color:var(--gold)} .drv .tx .fg{color:#9fd3ff} .drv .tx .to{color:var(--danger)} .drv .tx .rtd{color:var(--rev)}
.drv .tx small{display:block;color:var(--muted);font-size:12px}
.drv .rs{font:800 17px var(--cond);color:var(--muted);white-space:nowrap}
.drv.scored .rs{color:var(--text)}
.box{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bx{--pc:var(--p1);background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:12px;overflow:hidden;min-width:0}
.bx.t1{--pc:var(--p2)}
.bx-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:linear-gradient(90deg,var(--pc),transparent);font:800 22px/1 var(--cond);font-stretch:condensed;text-transform:uppercase}
.bx-h .f{font-size:40px}
.bp{padding:10px 12px;border-top:1px solid var(--line)}
.bp-top{display:flex;gap:10px;align-items:center}
.bp-nm{font:800 18px/1.05 var(--cond);font-stretch:condensed;text-transform:uppercase}
.bp-sub{font-size:11px;color:var(--muted);letter-spacing:.06em}
.gl{margin-top:7px;font:700 17px/1.2 var(--cond);font-stretch:condensed;letter-spacing:.02em;color:var(--text)}
.gl .k{color:var(--muted);font-weight:600;font-size:13px;letter-spacing:.08em}
.season{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px}
.season span{font-size:12px;color:var(--muted)}
.season b{color:var(--text);font:700 14px var(--cond)}
.season span.cat b{color:var(--gold)}
.verdict{text-align:center;padding:22px 14px;border-radius:14px;background:linear-gradient(180deg,var(--vd,#111),var(--panel));border:2px solid var(--vc,var(--line2))}
.verdict h2{margin:0;font:800 clamp(44px,12vw,86px)/.9 var(--cond);font-stretch:condensed;text-transform:uppercase;color:var(--vc)}
.verdict .fs{font:800 32px var(--cond);margin-top:6px}
.verdict p{color:#cfd7e4;margin:10px auto 0;max-width:560px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:14px}
.facts div{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px}
.facts b{display:block;font:800 22px var(--cond)}
.foot{margin-top:auto;padding:18px 0 14px;text-align:center;color:var(--dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase}

/* ---------- online play ---------- */
body[data-mine="0"]::before{opacity:.35;box-shadow:none}
.netbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px 14px;margin-bottom:18px}
.netbox > .seg{display:flex;width:100%;margin-top:8px}
.netbox > .seg button{flex:1}
.netbox p{margin:10px 0 0;font-size:13px;color:#cfd7e4}
.codebig{font:800 56px/1 var(--cond);font-stretch:condensed;letter-spacing:.14em;color:var(--gold);text-align:center;margin:12px 0 2px}
.netrow{display:flex;gap:8px;margin-top:10px}
.netrow .btn{flex:1;min-height:50px;font-size:17px}
.netinput{width:100%;min-height:60px;margin-top:10px;border-radius:10px;border:2px solid var(--line2);background:var(--bg2);color:var(--text);font:800 32px var(--cond);font-stretch:condensed;letter-spacing:.24em;text-align:center;text-transform:uppercase}
.netinput:focus{outline:none;border-color:var(--gold)}
.linkbox{width:100%;margin-top:8px;padding:10px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);color:var(--muted);font:12px/1.3 ui-monospace,Consolas,monospace}
.netstatus{margin-top:10px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.netstatus.ok{color:var(--rev)} .netstatus.bad{color:var(--danger)}
.netbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px;padding:6px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font:700 11px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.netbar b{color:var(--text)}
.netbar.bad{border-color:var(--danger);color:var(--danger);text-transform:none;letter-spacing:.02em;font-size:13px}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:dot 1.2s infinite both}
.dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.2}40%{opacity:1}}
.waitline{display:flex;align-items:center;gap:10px;color:#cfd7e4;font-size:15px;padding:8px 2px}
.dock-in.wait{border-color:var(--line2);box-shadow:none}
.dock-in.wait .dock-head{background:var(--panel2);color:var(--text)}
.dock-in.wait .dock-head::after{display:none}
.dock-in.wait h2{color:var(--act)}
.lobby{text-align:center}
.lobby .codebig{font-size:40px}
.sumlist{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:left}
.sumlist li{background:var(--bg2);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--muted)}
.sumlist b{display:block;color:var(--text);font:800 18px var(--cond);font-stretch:condensed;text-transform:uppercase}

/* ---------- secret picks ---------- */
.pickrow{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:8px;width:100%;min-height:58px;padding:8px 12px;background:transparent;border:0;border-top:1px solid var(--line);text-align:left}
.pickrow[aria-pressed="true"]{background:linear-gradient(90deg,var(--act-deep,#222),transparent);box-shadow:inset 4px 0 0 var(--act)}
.pickrow b.slot{font:800 20px var(--cond);color:var(--act)}
.pickrow .nm{font:800 16px/1.1 var(--cond);font-stretch:condensed;text-transform:uppercase}
.pickrow .sub{font-size:11px;color:var(--muted)}
.cover{text-align:center;padding:28px 16px}
.cover h2{margin:0;font:800 44px/.95 var(--cond);font-stretch:condensed;text-transform:uppercase;color:var(--act)}
.cover p{color:#cfd7e4;margin:10px auto 18px;max-width:420px}
.pickcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pickcard{--pc:var(--p1);background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:12px;padding:12px;text-align:center;animation:stamp .4s cubic-bezier(.2,1.4,.4,1) both}
.pickcard.t1{--pc:var(--p2);animation-delay:.25s}
.pickcard .who{font:800 16px var(--cond);color:var(--pc);text-transform:uppercase;letter-spacing:.06em}
.pickcard .what{font:800 38px/1 var(--cond);font-stretch:condensed;text-transform:uppercase;margin:6px 0}
.pickcard .out{font-size:13px;color:#cfd7e4}
.pickcard .out b{display:block;font:800 18px var(--cond);text-transform:uppercase;letter-spacing:.04em}
.out.blocked b{color:var(--danger)} .out.swapped b{color:var(--gold)} .out.held b{color:var(--rev)} .out.idle b{color:var(--muted)}
.verify{font:700 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--rev);text-align:center}
.verify.bad{color:var(--danger)}

  .app{padding:10px 12px 0}
  .dock{margin:4px -12px 0;padding-left:12px;padding-right:12px}

  .pp-budget{font-size:28px}
  .pp-name{font-size:16px}

  .teams,.box{grid-template-columns:1fr}

}
function startDump() {
  const L = G.lot;
  L.phase = 'dump'; L.bid = 0; L.high = null; L.turn = L.opener; L.amt = 1; L.zeroPasses = 0;

}
function dumpFlip() {
  const L = G.lot, stuck = rand() < 0.5 ? 0 : 1;

/* ---------- solo ---------- */
function setSoloPrice() {
  const L = G.lot, d = G.pl[L.bidder].declines[L.pos];
  L.price = 1 + d; L.forced = d >= 3;
}
function soloCharge(p) {
  const L = G.lot;
  return L.forced ? Math.min(L.price, Math.max(0, maxAllow(p))) : L.price;
}
function doSign(p) {
  const L = G.lot;
  if (L.phase !== 'solo' || L.bidder !== p) return;
  if (!L.forced && L.price > maxAllow(p)) return;
  const cost = soloCharge(p);
  ev(`${G.pl[p].name} signs for ${money(cost)}${L.forced ? ' (forced)' : ''}.`, p);
  award(p, L.forced ? 'forced' : 'solo', cost);
}
function doDecline(p, auto) {
  const L = G.lot;
  if (L.phase !== 'solo' || L.bidder !== p || L.forced) return;
  G.pl[p].declines[L.pos]++;
  if (!auto) ev(`${G.pl[p].name} declines ${shortName(P(L.pid))} at ${money(L.price)}.`, p);
  const d = drawPlayer(L.pos, L.seen);
  if (d.reused) L.notes.push(`${L.pos} pool is exhausted. Re-offering the least-recently-drawn ${L.pos}.`);
  L.pid = d.id; L.seen.push(d.id);

}
/* Auto-actions for a player at their budget limit. */
function settle() {
  const L = G.lot;
  for (let guard = 0; guard < 16; guard++) {
    if (L.phase === 'bid' || L.phase === 'dump') {
      const p = L.turn, m = phaseMax(p);
      if (m < L.bid + 1) { ev(`${G.pl[p].name} is capped at ${money(Math.max(0, m))}: auto-pass.`, p); doPass(p, true); continue; }
      L.amt = clamp(L.amt, L.bid + 1, m);
    } else if (L.phase === 'solo') {
      const p = L.bidder;
      if (!L.forced && L.price > maxAllow(p)) { ev(`${G.pl[p].name} can't afford ${money(L.price)}: auto-decline.`, p); doDecline(p, true); continue; }
    }

  }
}
/* ---------- resolution ---------- */
// p takes the player for cost. pay = { payer, amt } when someone else paid the bank to dump him on p.
function award(p, how, cost, pay) {
  const L = G.lot;
  L.pending = { p, how, cost, pay: pay || null };
  const opts = slotOptions(G.pl[p], L.pos);
  if (opts.length > 1) { L.phase = 'slot'; return; }
  placeInSlot(opts[0] || emptySlots(G.pl[p])[0] || null);
}
function placeInSlot(slot) {
  const L = G.lot, { p, how, cost, pay } = L.pending, pl = G.pl[p];
  const before = pl.budget;
  pl.budget -= cost;
  let payer = null;
  if (pay) {
    const pp = G.pl[pay.payer];
    payer = { p: pay.payer, amt: pay.amt, before: pp.budget, after: pp.budget - pay.amt };
    pp.budget -= pay.amt;
  }
  if (slot) pl.roster[slot] = { id: L.pid, price: cost, how, lot: L.n, swapped: false, dumpedBy: pay ? pay.payer : null };
  L.result = { p, slot, how, cost, before, after: pl.budget, payer };
  L.phase = 'done';
  G.hist.push({ n: L.n, pos: L.pos, pid: L.pid, p, slot, how, cost, payer });
}
function doSkip(p) {

  pl.skipUsed = true;
  G.hist.push({ n: L.n, pos: L.pos, pid: L.pid, p, how: 'skip', cost: 0 });
  G.flash = `Lot ${L.n} was killed by ${pl.name}'s SKIP. ${P(L.pid).name} is gone from the pool.`;

}
function canSkip(p) {

function nextLot() {
